# ---------------------------------------------------------------------------
# Builds the class SQL Server image once and publishes it to GHCR, so that
# student codespaces PULL a finished image instead of BUILDING one.
#
# This is the practical substitute for Codespaces prebuilds, which are
# configured per-repository and do not propagate through a template or a
# Classroom assignment.
#
# GHCR rather than Docker Hub on purpose: Docker Hub rate-limits anonymous
# pulls per source IP, Codespaces egress addresses are shared, and a whole
# class launching at once is exactly the pattern that trips it. GHCR has no
# equivalent limit and Codespaces authenticates to it automatically.
#
# AFTER THE FIRST SUCCESSFUL RUN the package is PRIVATE. Go to the org page →
# Packages → ulht-db26-class → Package settings → Change visibility → Public.
# Student codespaces cannot pull a private package, and the failure is an
# opaque "manifest unknown" at container create.
# ---------------------------------------------------------------------------
name: Build class SQL Server image

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image name WITHOUT the owner — the owner is computed at run time and
  # lower-cased, because GHCR rejects any uppercase character in a path
  # GitHub usernames preserve case, org names here do not, so this makes the
  # workflow work from either.
  IMAGE_BASENAME: ulht-db26-class
  VERSION: '1.2.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # REQUIRED for cache-from/cache-to: type=gha below. Without buildx, the
      # build falls back to the default docker driver, which cannot export a
      # cache, and the build step fails with
      #   "Cache export is not supported for the docker driver"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name (lower-case)
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${REGISTRY}/${OWNER}/${IMAGE_BASENAME}" >> "$GITHUB_ENV"
          echo "Publishing to ${REGISTRY}/${OWNER}/${IMAGE_BASENAME}:${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./image
          push: true
          # Codespaces is amd64; no need for multi-arch here, which is the
          # other reason the Apple-Silicon workarounds can go.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          # No cache-from/cache-to here on purpose.
          #
          # `type=gha` needs the GitHub Actions cache backend, which is
          # version-sensitive (it failed with "buildx failed ... see
          # build-cache-backends"). It would only pay off if this image were
          # rebuilt often — it is rebuilt when image/Dockerfile changes, i.e.
          # roughly never. A cold build here is ~2-3 minutes.
          #
          # If you ever do want it back, keep the Set up Buildx step above and
          # add:  cache-from: type=gha  /  cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # `docker pull` rather than relying on a local image: with the buildx
          # driver the built image is pushed straight to the registry and is
          # NOT left in the local docker daemon, so `docker run` on the tag
          # would fail with "Unable to find image locally" on a private repo.
          docker pull ${{ env.IMAGE }}:${{ env.VERSION }}
          docker run -d --name smoke \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='Smoke#Test123!' \
            ${{ env.IMAGE }}:${{ env.VERSION }}
          for i in $(seq 1 60); do
            if docker exec smoke /opt/mssql-tools18/bin/sqlcmd \
                 -C -S localhost -U sa -P 'Smoke#Test123!' -Q "SELECT @@VERSION" 2>/dev/null; then
              echo "Image is healthy."; exit 0
            fi
            sleep 5
          done
          echo "Image failed to become healthy."; docker logs smoke; exit 1
